<!DOCTYPE html>
<html>
<head>
    <title>Facebook</title>
</head>
<body>

<h1>facebook</h1>

<form>
    <table>
        <tr>
            <td>Email or Phone</td>
            <td>Password</td>
        </tr>
        <tr>
            <td><input type="text" placeholder="Email or Phone"></td>
            <td><input type="password" placeholder="Password"></td>
            <td><button type="submit">Log In</button></td>
        </tr>
        <tr>
            <td></td>
            <td><a href="#">Forgot your password?</a></td>
        </tr>
    </table>
</form>

<hr>


<h3>Facebook helps you connect and share with the people in your life.</h3>

<hr>

<h2>Sign Up</h2>
<p>It's free and always will be.</p>

<form>
    <input type="text" placeholder="First Name">
    <input type="text" placeholder="Last Name"><br><br>

    <input type="text" placeholder="Your Email"><br><br>

    <input type="text" placeholder="Re-enter Email"><br><br>

    <input type="password" placeholder="New Password"><br><br>

    <label>Birthday:</label><br>
    <select>
        <option>Month</option>
    </select>
    <select>
        <option>Day</option>
    </select>
    <select>
        <option>Year</option>
    </select>
    <br><br>

    <input type="radio" name="gender"> Female
    <input type="radio" name="gender"> Male
    <br><br>

    <button type="submit">Sign Up</button>
</form>

<p>Create a Page for a celebrity, band or business.</p>

</body>
</html>
